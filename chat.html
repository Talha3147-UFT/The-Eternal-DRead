<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Chat — The Eternal Dread</title>
<link rel="icon" href="assets/images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ffffff; --bg-soft:#f8fafc; --text:#0b1220; --muted:#64748b; --muted-2:#94a3b8;
  --border:#e5e9f0; --border-strong:#d7dde7; --accent:#0b1220;
  --success:#16a34a; --danger:#dc2626;
  --shadow-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-2:0 10px 30px rgba(16,24,40,.08),0 4px 10px rgba(16,24,40,.04);
  --shadow-3:0 20px 50px rgba(16,24,40,.12);
  --shadow-glow:0 0 0 1px rgba(17,24,39,.04),0 20px 60px rgba(17,24,39,.10);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);color:var(--text);line-height:1.6;
  background:
    radial-gradient(900px 700px at 12% -10%, rgba(15,23,42,.05), transparent 60%),
    radial-gradient(700px 600px at 100% 100%, rgba(30,41,59,.04), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,textarea{font-family:inherit}

/* ====== HEADER ====== */
header.nav-wrap{
  padding:14px 22px;
  position:relative;z-index:20;
}
.nav{
  max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 10px 16px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(226,232,240,.9);border-radius:16px;
  box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.6);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:38px;height:38px;border-radius:12px;object-fit:cover;
  border:1px solid var(--border);
  box-shadow:0 8px 20px rgba(17,24,39,.12),0 0 0 4px rgba(17,24,39,.03);
}
.brand-text strong{display:block;font-size:.82rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:800;}
.brand-text small{display:block;font-size:.58rem;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:600;}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{
  display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;
  font-size:.85rem;font-weight:500;color:var(--muted);transition:all .22s var(--ease);
}
.nav-links a svg{width:16px;height:16px;opacity:.85}
.nav-links a:hover{color:var(--text);background:rgba(15,23,42,.04)}
.nav-links a.active{color:var(--text);background:rgba(15,23,42,.06);font-weight:600}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;padding:0;overflow:hidden;
  border:2px solid #fff;cursor:pointer;
  box-shadow:0 0 0 2px rgba(15,23,42,.08),0 6px 16px rgba(15,23,42,.15);
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);
  transition:transform .25s var(--ease);
}
.avatar-btn:hover{transform:scale(1.04)}
.avatar-btn img{width:100%;height:100%;object-fit:cover}

/* ====== MAIN LAYOUT ====== */
.chat-app{
  max-width:1440px;margin:0 auto;
  padding:0 22px 22px;
  height:calc(100vh - 92px);
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;
}

/* ====== SIDEBAR ====== */
.chat-sidebar{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fff,#fbfcfe);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow-2);
  overflow:hidden;min-height:0;
}
.sidebar-head{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--border);
}
.sidebar-head h2{
  font-family:var(--font-serif);font-size:1.15rem;font-weight:700;
  letter-spacing:-.4px;color:#0b1220;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.sidebar-head h2 svg{width:18px;height:18px}
.search-wrap{position:relative}
.search-wrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted-2);pointer-events:none;
}
.search-input{
  width:100%;padding:9px 12px 9px 36px;
  border-radius:10px;border:1px solid var(--border);
  background:#fff;font-size:.84rem;color:var(--text);
  box-shadow:var(--shadow-1);
  transition:border .2s, box-shadow .25s;
}
.search-input::placeholder{color:#a7b0c0}
.search-input:focus{
  outline:none;border-color:#0b1220;
  box-shadow:0 0 0 3px rgba(15,23,42,.05);
}

/* Tabs */
.sidebar-tabs{
  display:flex;gap:4px;padding:8px 12px;
  border-bottom:1px solid var(--border);
  background:rgba(248,250,252,.5);
}
.tab-btn{
  flex:1;padding:7px 10px;border-radius:8px;
  background:transparent;border:none;cursor:pointer;
  font-size:.76rem;font-weight:600;letter-spacing:.4px;
  color:var(--muted);transition:all .2s var(--ease);
}
.tab-btn:hover{color:#0b1220}
.tab-btn.active{
  background:#fff;color:#0b1220;
  box-shadow:var(--shadow-1);
}

/* Convo list */
.convo-list{
  flex:1;overflow-y:auto;padding:6px;
  min-height:0;
}
.convo-list::-webkit-scrollbar{width:5px}
.convo-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.convo-list::-webkit-scrollbar-track{background:transparent}

.convo-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:12px;
  cursor:pointer;transition:background .2s var(--ease);
  position:relative;
}
.convo-item:hover{background:rgba(15,23,42,.04)}
.convo-item.active{background:rgba(15,23,42,.08)}
.convo-item.active::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;
  width:3px;border-radius:0 3px 3px 0;
  background:#0b1220;
}
.convo-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);
  border:2px solid #fff;position:relative;
  box-shadow:0 4px 12px rgba(15,23,42,.10);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted);
}
.convo-avatar img{width:100%;height:100%;object-fit:cover}
.convo-avatar .dot{
  position:absolute;bottom:0;right:0;
  width:11px;height:11px;border-radius:50%;background:#94a3b8;
  border:2px solid #fff;
}
.convo-avatar .dot.online{
  background:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,.2);
  animation:pulseGreen 2s infinite;
}
@keyframes pulseGreen{50%{box-shadow:0 0 0 5px rgba(34,197,94,.08)}}

.convo-meta{flex:1;min-width:0}
.convo-meta .name{
  font-size:.88rem;font-weight:600;color:#0b1220;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.convo-meta .preview{
  font-size:.76rem;color:var(--muted-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.convo-meta .preview.unread{color:#0b1220;font-weight:600}
.convo-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.convo-time{font-size:.68rem;color:var(--muted-2)}
.unread-badge{
  min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:#0b1220;color:#fff;
  font-size:.66rem;font-weight:700;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(15,23,42,.25);
}

/* ====== MAIN CHAT AREA ====== */
.chat-main{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fff,#fbfcfe);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow-2);
  overflow:hidden;min-height:0;position:relative;
}

/* Empty state */
.chat-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;color:var(--muted);
}
.chat-empty .icon{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(180deg,#0f172a,#0b1220);
  display:grid;place-items:center;margin-bottom:20px;
  box-shadow:0 20px 40px rgba(15,23,42,.24);
}
.chat-empty .icon svg{width:36px;height:36px;color:#fff;}
.chat-empty h3{
  font-family:var(--font-serif);font-size:1.4rem;font-weight:700;
  color:#0b1220;margin-bottom:8px;letter-spacing:-.3px;
}
.chat-empty p{font-size:.92rem;max-width:360px;line-height:1.6}

/* Chat header */
.chat-header{
  display:none;align-items:center;gap:12px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);
}
.chat-header.show{display:flex}
.back-btn{
  display:none;width:36px;height:36px;border-radius:10px;
  background:transparent;border:none;cursor:pointer;color:var(--text);
  align-items:center;justify-content:center;
  transition:background .2s;
  flex-shrink:0;
}
.back-btn:hover{background:rgba(15,23,42,.06)}
.back-btn svg{width:18px;height:18px}

.chat-peer{
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;
  cursor:pointer;
}
.chat-peer .avatar{
  width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);
  border:2px solid #fff;position:relative;
  box-shadow:0 4px 12px rgba(15,23,42,.10);
  display:grid;place-items:center;font-weight:700;font-size:.86rem;color:var(--muted);
}
.chat-peer .avatar img{width:100%;height:100%;object-fit:cover}
.chat-peer .avatar .dot{
  position:absolute;bottom:0;right:0;
  width:11px;height:11px;border-radius:50%;background:#94a3b8;border:2px solid #fff;
}
.chat-peer .avatar .dot.online{
  background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.2);
  animation:pulseGreen 2s infinite;
}
.chat-peer .meta{flex:1;min-width:0}
.chat-peer .name{font-size:.94rem;font-weight:600;color:#0b1220;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-peer .status{
  font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:5px;
}
.chat-peer .status .dot-mini{
  width:6px;height:6px;border-radius:50%;background:#94a3b8;
}
.chat-peer .status.online .dot-mini{
  background:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,.2);
}
.chat-peer .status.online{color:#16a34a;font-weight:500}

.header-actions{display:flex;gap:6px;flex-shrink:0}
.header-btn{
  width:36px;height:36px;border-radius:10px;
  background:transparent;border:none;cursor:pointer;color:var(--muted);
  display:grid;place-items:center;transition:all .2s;
}
.header-btn:hover{background:rgba(15,23,42,.06);color:#0b1220}
.header-btn svg{width:18px;height:18px}

/* Messages area */
.messages-area{
  flex:1;overflow-y:auto;padding:24px 24px 8px;
  display:none;flex-direction:column;gap:2px;
  min-height:0;scroll-behavior:smooth;
}
.messages-area.show{display:flex}
.messages-area::-webkit-scrollbar{width:6px}
.messages-area::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.messages-area::-webkit-scrollbar-track{background:transparent}

.msg-row{
  display:flex;gap:8px;align-items:flex-end;
  margin-bottom:2px;
  animation:msgIn .35s var(--ease);
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-row.mine{flex-direction:row-reverse}
.msg-row.first{margin-top:10px}

.msg-avatar{
  width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);
  display:grid;place-items:center;font-weight:700;font-size:.68rem;color:var(--muted);
  border:1px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.08);
  opacity:0;transition:opacity .2s;
}
.msg-row.first .msg-avatar{opacity:1}
.msg-avatar img{width:100%;height:100%;object-fit:cover}

.msg-bubble{
  max-width:70%;padding:10px 14px;border-radius:18px;
  font-size:.92rem;line-height:1.5;color:#1f2937;
  background:#fff;border:1px solid var(--border);
  box-shadow:0 2px 6px rgba(15,23,42,.05);
  word-wrap:break-word;white-space:pre-wrap;
  position:relative;
}
.msg-row.mine .msg-bubble{
  background:linear-gradient(180deg,#0f172a,#0b1220);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(15,23,42,.24);
}
/* Rounded corner variations for grouped messages */
.msg-row:not(.first) .msg-bubble{
  border-top-left-radius:6px;
}
.msg-row.mine:not(.first) .msg-bubble{
  border-top-right-radius:6px;border-top-left-radius:18px;
}
.msg-row.first .msg-bubble{border-top-left-radius:18px;border-top-right-radius:18px;}

.msg-time{
  font-size:.66rem;color:var(--muted-2);
  margin:0 6px 6px;
  align-self:flex-end;
  flex-shrink:0;
  opacity:0;
  transition:opacity .2s;
}
.msg-row:hover .msg-time{opacity:1}

/* Date divider */
.date-divider{
  display:flex;align-items:center;gap:12px;
  margin:16px 0 10px;
  font-size:.7rem;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted-2);
}
.date-divider::before,
.date-divider::after{
  content:"";flex:1;height:1px;background:var(--border);
}

/* Typing indicator */
.typing-indicator{
  display:none;align-items:center;gap:8px;
  padding:8px 14px;margin:0 24px 10px;
  background:rgba(15,23,42,.04);border-radius:16px;
  width:fit-content;font-size:.8rem;color:var(--muted);
}
.typing-indicator.show{display:flex}
.typing-dots{display:flex;gap:3px}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--muted);
  animation:typingDot 1.2s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* Input */
.chat-input-wrap{
  display:none;padding:14px 20px 18px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);
  border-top:1px solid var(--border);
}
.chat-input-wrap.show{display:block}
.chat-input-form{
  display:flex;align-items:flex-end;gap:10px;
  background:#fff;border:1px solid var(--border);
  border-radius:22px;padding:6px 6px 6px 16px;
  box-shadow:var(--shadow-1);
  transition:border .2s, box-shadow .25s;
}
.chat-input-form:focus-within{
  border-color:#0b1220;
  box-shadow:0 0 0 4px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.06);
}
.chat-input{
  flex:1;padding:9px 0;border:none;outline:none;
  background:transparent;font-size:.92rem;color:var(--text);
  resize:none;max-height:120px;line-height:1.5;font-family:inherit;
}
.chat-input::placeholder{color:#a7b0c0}
.send-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(180deg,#0f172a,#0b1220);color:#fff;
  border:none;cursor:pointer;display:grid;place-items:center;
  transition:all .25s var(--ease);
}
.send-btn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 8px 20px rgba(15,23,42,.28)}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.send-btn svg{width:18px;height:18px}

/* Empty list state */
.list-empty{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:.86rem;line-height:1.6;
}
.list-empty svg{width:36px;height:36px;color:var(--muted-2);margin:0 auto 10px;opacity:.5;}

/* Skeleton */
.skeleton{
  background:linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Toast */
.toast-wrap{
  position:fixed;top:20px;right:20px;z-index:200;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  min-width:250px;max-width:340px;padding:12px 16px;border-radius:12px;
  background:#0b1220;color:#fff;font-size:.86rem;
  box-shadow:0 14px 30px rgba(15,23,42,.35);
  display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:toastIn .3s var(--ease);
}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Mobile */
@media (max-width:1080px){
  .chat-app{grid-template-columns:300px minmax(0,1fr);}
}
@media (max-width:900px){
  .nav-links{display:none}
}
@media (max-width:760px){
  html,body{height:100%;overflow:hidden}
  header.nav-wrap{padding:10px 12px;}
  .nav{padding:8px 10px 8px 12px;border-radius:14px;}
  .brand-text strong{font-size:.72rem;letter-spacing:1.8px}
  .brand-text small{font-size:.52rem;letter-spacing:2px}
  .brand-logo{width:34px;height:34px}

  .chat-app{
    grid-template-columns:1fr;
    padding:0 10px 10px;
    height:calc(100vh - 84px);
    position:relative;
  }

  .chat-sidebar{
    grid-column:1;
    position:absolute;inset:0;
    transition:transform .3s var(--ease);
    z-index:5;
  }
  .chat-sidebar.hidden{transform:translateX(-110%)}

  .chat-main{grid-column:1;position:relative;z-index:1;}

  .back-btn{display:flex;}
  .messages-area{padding:16px 14px 8px;}
  .msg-bubble{max-width:78%;font-size:.88rem;}
  .msg-time{display:none;}
  .chat-input-wrap{padding:10px 12px 14px;}
}
</style>
</head>
<body>

<header class="nav-wrap">
  <nav class="nav">
    <div class="brand">
      <img src="assets/images/logo.png" alt="The Eternal Dread" class="brand-logo" />
      <div class="brand-text">
        <strong>The Eternal Dread</strong>
        <small>Friends • Memories • Forever</small>
      </div>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        Home
      </a>
      <a href="friends.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Friends
      </a>
      <a href="posts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Posts
      </a>
      <a href="chat.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>
      <a href="events.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Events
      </a>
      <a href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </div>
    <a href="profile.html" class="avatar-btn" aria-label="Profile">
      <img id="navAvatar" src="" alt="Me" style="display:none" />
      <span id="navAvatarInitial" style="display:grid;place-items:center;width:100%;height:100%;font-weight:700;color:var(--muted);font-size:.8rem"></span>
    </a>
  </nav>
</header>

<div class="chat-app">
  <!-- SIDEBAR -->
  <aside class="chat-sidebar" id="chatSidebar">
    <div class="sidebar-head">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </h2>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="convSearch" type="text" class="search-input" placeholder="Search people…" autocomplete="off" />
      </div>
    </div>
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="unread">Unread</button>
      <button class="tab-btn" data-tab="online">Online</button>
    </div>
    <div class="convo-list" id="convoList">
      <div style="padding:8px 6px">
        <div class="skeleton" style="height:52px;margin-bottom:8px"></div>
        <div class="skeleton" style="height:52px;margin-bottom:8px"></div>
        <div class="skeleton" style="height:52px"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <section class="chat-main">
    <!-- Empty state (no conversation selected) -->
    <div class="chat-empty" id="chatEmpty">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h3>Select a conversation</h3>
      <p>Choose someone from the list to begin a chat — or start a new one.</p>
    </div>

    <!-- Chat header -->
    <div class="chat-header" id="chatHeader">
      <button class="back-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="chat-peer" id="chatPeer">
        <div class="avatar" id="peerAvatar">
          <span id="peerInitial">?</span>
          <span class="dot" id="peerDot"></span>
        </div>
        <div class="meta">
          <div class="name" id="peerName">Loading…</div>
          <div class="status" id="peerStatus"><span class="dot-mini"></span><span id="peerStatusText">offline</span></div>
        </div>
      </div>
    </div>

    <!-- Messages area -->
    <div class="messages-area" id="messagesArea"></div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span id="typingText">typing…</span>
    </div>

    <!-- Input -->
    <div class="chat-input-wrap" id="chatInputWrap">
      <form class="chat-input-form" id="chatForm">
        <textarea id="chatInput" class="chat-input" placeholder="Type a message…" rows="1"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </section>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
  import { requireAuth } from './js/auth.js';
  import {
    getUserDoc, getAllMembers, sendMessage, listenToConversation,
    markConversationAsRead, getUnreadCounts
  } from './js/app.js';
  import { showToast, initCommonUI } from './js/main.js
    initCommonUI();

  let currentUser = null;
  let me = null;
  let allMembers = [];
  let filteredMembers = [];
  let currentTab = 'all';
  let currentSearch = '';
  let activePeer = null;
  let messages = [];
  let unsubscribeMessages = null;
  let unreadMap = {}; // { peerId: count }
  let typingTimeout = null;

  // DOM
  const convoList = document.getElementById('convoList');
  const chatEmpty = document.getElementById('chatEmpty');
  const chatHeader = document.getElementById('chatHeader');
  const messagesArea = document.getElementById('messagesArea');
  const chatInputWrap = document.getElementById('chatInputWrap');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatSidebar = document.getElementById('chatSidebar');
  const backBtn = document.getElementById('backBtn');
  const convSearch = document.getElementById('convSearch');

  // ============ AUTH ============
  requireAuth(async (user) => {
    currentUser = user;
    try {
      me = await getUserDoc(user.uid);
      updateNavAvatar();
      await loadMembers();
      renderConvoList();

      // Auto-open conversation from ?to=UID
      const params = new URLSearchParams(location.search);
      const peerUid = params.get('to');
      if (peerUid && peerUid !== user.uid){
        setTimeout(()=> openConversation(peerUid), 300);
      }
    } catch (e){
      console.error(e);
      showToast('Could not load chat.', 'error');
    }
  });

  // ============ HELPERS ============
  function esc(s){
    if (s == null) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function timeAgo(ts){
    if (!ts) return '';
    const date = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = (Date.now() - date.getTime()) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff/60) + 'm';
    if (diff < 86400) return Math.floor(diff/3600) + 'h';
    if (diff < 604800) return Math.floor(diff/86400) + 'd';
    return date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function formatTime(ts){
    if (!ts) return '';
    const date = ts.toDate ? ts.toDate() : new Date(ts);
    return date.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  }
  function formatDateLabel(ts){
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const today = new Date();
    const yest = new Date(Date.now() - 86400000);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yest.toDateString()) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
  }

  function updateNavAvatar(){
    const name = (me && me.name) || 'Member';
    const photo = (me && me.profileImageBase64) || '';
    const navImg = document.getElementById('navAvatar');
    const navInitial = document.getElementById('navAvatarInitial');
    if (photo){
      navImg.src = photo; navImg.style.display = 'block';
      navInitial.style.display = 'none';
    } else {
      navInitial.textContent = name.charAt(0).toUpperCase();
      navInitial.style.display = 'grid';
      navImg.style.display = 'none';
    }
  }

  // ============ LOAD MEMBERS ============
  async function loadMembers(){
    allMembers = await getAllMembers({ excludeUid: currentUser.uid });
    // Try to load unread counts (optional)
    try {
      unreadMap = await getUnreadCounts(currentUser.uid) || {};
    } catch(e){ unreadMap = {}; }
  }

  // ============ RENDER CONVERSATION LIST ============
  function applyFilters(){
    const q = currentSearch.trim().toLowerCase();
    filteredMembers = allMembers.filter(m => {
      if (currentTab === 'online' && m.status !== 'online') return false;
      if (currentTab === 'unread' && !unreadMap[m.id]) return false;
      if (!q) return true;
      const name = (m.name || '').toLowerCase();
      const nick = (m.nickname || '').toLowerCase();
      return name.includes(q) || nick.includes(q);
    });
    // Sort: online first, then those with unread, then alphabetical
    filteredMembers.sort((a,b)=>{
      const aUnread = unreadMap[a.id] || 0;
      const bUnread = unreadMap[b.id] || 0;
      if (aUnread !== bUnread) return bUnread - aUnread;
      const aOn = a.status === 'online' ? 1 : 0;
      const bOn = b.status === 'online' ? 1 : 0;
      if (aOn !== bOn) return bOn - aOn;
      return (a.name || '').localeCompare(b.name || '');
    });
    renderConvoList();
  }

  function renderConvoList(){
    if (!filteredMembers || filteredMembers.length === 0){
      const isFiltered = currentSearch || currentTab !== 'all';
      convoList.innerHTML = `
        <div class="list-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <div>${isFiltered ? 'No results found.' : 'No one to chat with yet.'}</div>
        </div>`;
      return;
    }
    convoList.innerHTML = filteredMembers.map(m => {
      const name = m.name || 'Member';
      const photo = m.profileImageBase64 || '';
      const initial = name.charAt(0).toUpperCase();
      const online = m.status === 'online' ? 'online' : '';
      const unread = unreadMap[m.id] || 0;
      const active = activePeer && activePeer.id === m.id ? 'active' : '';
      return `
        <div class="convo-item ${active}" data-convo="${esc(m.id)}">
          <div class="convo-avatar">
            ${photo ? `<img src="${photo}" alt="">` : esc(initial)}
            <span class="dot ${online}"></span>
          </div>
          <div class="convo-meta">
            <div class="name">${esc(name)}</div>
            <div class="preview ${unread ? 'unread' : ''}">@${esc(m.nickname || 'member')}</div>
          </div>
          <div class="convo-right">
            ${unread ? `<span class="unread-badge">${unread > 9 ? '9+' : unread}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    convoList.querySelectorAll('[data-convo]').forEach(el => {
      el.addEventListener('click', ()=>{
        openConversation(el.getAttribute('data-convo'));
      });
    });
  }

  // ============ OPEN CONVERSATION ============
  async function openConversation(peerId){
    if (!peerId) return;
    const peer = allMembers.find(m => m.id === peerId);
    if (!peer){
      showToast('User not found.', 'error');
      return;
    }
    activePeer = peer;

    // Toggle view
    chatEmpty.style.display = 'none';
    chatHeader.classList.add('show');
    messagesArea.classList.add('show');
    chatInputWrap.classList.add('show');
    if (window.innerWidth <= 760){
      chatSidebar.classList.add('hidden');
    }

    // Header
    renderPeerHeader(peer);
    renderConvoList(); // update active state

    // Clear + show skeleton
    messagesArea.innerHTML = `
      <div class="skeleton" style="height:36px;width:60%;margin-bottom:10px"></div>
      <div class="skeleton" style="height:36px;width:40%;margin-left:auto;margin-bottom:10px"></div>
      <div class="skeleton" style="height:36px;width:70%"></div>
    `;

    // Unsubscribe previous
    if (typeof unsubscribeMessages === 'function'){
      try { unsubscribeMessages(); } catch(e){}
      unsubscribeMessages = null;
    }

    // Listen to messages
    try {
      unsubscribeMessages = listenToConversation(currentUser.uid, peer.id, (msgs) => {
        messages = msgs;
        renderMessages();
        markConversationAsRead(currentUser.uid, peer.id).catch(()=>{});
        if (unreadMap[peer.id]){
          delete unreadMap[peer.id];
          renderConvoList();
        }
      });
    } catch (e){
      console.error(e);
      // Fallback: try direct load
      messages = [];
      renderMessages();
    }

    // Update URL without reload
    try {
      const u = new URL(location.href);
      u.searchParams.set('to', peer.id);
      history.replaceState({}, '', u.toString());
    } catch(e){}

    chatInput.focus();
  }

  function renderPeerHeader(peer){
    const photo = peer.profileImageBase64 || '';
    const name = peer.name || 'Member';
    const initial = name.charAt(0).toUpperCase();
    const avatarEl = document.getElementById('peerAvatar');
    avatarEl.innerHTML = photo ? `<img src="${photo}" alt="">` : esc(initial);
    const dot = document.createElement('span');
    dot.className = 'dot ' + (peer.status === 'online' ? 'online' : '');
    avatarEl.appendChild(dot);

    document.getElementById('peerName').textContent = name;
    const statusWrap = document.getElementById('peerStatus');
    statusWrap.classList.toggle('online', peer.status === 'online');
    document.getElementById('peerStatusText').textContent = peer.status === 'online' ? 'online' : 'offline';

    document.getElementById('chatPeer').onclick = ()=>{
      location.href = `profile.html?uid=${encodeURIComponent(peer.id)}`;
    };
  }

  // ============ RENDER MESSAGES ============
  function renderMessages(){
    if (!messages || messages.length === 0){
      messagesArea.innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:var(--muted-2);font-size:.86rem">
          No messages yet.<br>Say hello 👋
        </div>`;
      return;
    }

    let html = '';
    let lastDateKey = '';
    let lastSenderId = null;
    let lastGroupStart = true;

    messages.forEach((m) => {
      const d = m.createdAt ? (m.createdAt.toDate ? m.createdAt.toDate() : new Date(m.createdAt)) : new Date();
      const dateKey = d.toDateString();
      // Date divider
      if (dateKey !== lastDateKey){
        html += `<div class="date-divider">${esc(formatDateLabel(m.createdAt))}</div>`;
        lastDateKey = dateKey;
        lastSenderId = null;
      }

      const mine = m.senderId === currentUser.uid;
      const isFirst = m.senderId !== lastSenderId;
      const senderInfo = mine ? me : activePeer;
      const senderName = (senderInfo && senderInfo.name) || 'Member';
      const senderPhoto = (senderInfo && senderInfo.profileImageBase64) || '';
      const senderInitial = senderName.charAt(0).toUpperCase();

      html += `
        <div class="msg-row ${mine ? 'mine' : ''} ${isFirst ? 'first' : ''}">
          <div class="msg-avatar">${senderPhoto ? `<img src="${senderPhoto}" alt="">` : esc(senderInitial)}</div>
          <div class="msg-bubble">${esc(m.text)}</div>
          <div class="msg-time">${esc(formatTime(m.createdAt))}</div>
        </div>`;

      lastSenderId = m.senderId;
    });

    messagesArea.innerHTML = html;
    // Scroll to bottom
    requestAnimationFrame(()=>{
      messagesArea.scrollTop = messagesArea.scrollHeight;
    });
  }

  // ============ SEND MESSAGE ============
  chatInput.addEventListener('input', ()=>{
    sendBtn.disabled = !chatInput.value.trim();
    // Auto-grow
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  });

  chatInput.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if (!sendBtn.disabled) chatForm.requestSubmit();
    }
  });

  chatForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text || !activePeer) return;

    sendBtn.disabled = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';

    try {
      await sendMessage({
        senderId: currentUser.uid,
        receiverId: activePeer.id,
        text,
        type: 'text'
      });
    } catch (err){
      console.error(err);
      showToast('Could not send message.', 'error');
      chatInput.value = text;
    } finally {
      sendBtn.disabled = !chatInput.value.trim();
      chatInput.focus();
    }
  });

  // ============ SEARCH ============
  let searchTimer = null;
  convSearch.addEventListener('input', (e)=>{
    currentSearch = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });

  // ============ TABS ============
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-tab');
      applyFilters();
    });
  });

  // ============ BACK (mobile) ============
  backBtn.addEventListener('click', ()=>{
    chatSidebar.classList.remove('hidden');
    chatEmpty.style.display = 'flex';
    chatHeader.classList.remove('show');
    messagesArea.classList.remove('show');
    chatInputWrap.classList.remove('show');
    activePeer = null;
    if (typeof unsubscribeMessages === 'function'){
      try { unsubscribeMessages(); } catch(e){}
      unsubscribeMessages = null;
    }
    messages = [];
  });

  // ============ CLEANUP ============
  window.addEventListener('beforeunload', ()=>{
    if (typeof unsubscribeMessages === 'function'){
      try { unsubscribeMessages(); } catch(e){}
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Posts — Admin — The Eternal Dread</title>
<link rel="icon" href="../assets/images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ffffff;--bg-soft:#f8fafc;--text:#0b1220;--muted:#64748b;--muted-2:#94a3b8;
  --border:#e5e9f0;--border-strong:#d7dde7;--accent:#0b1220;
  --success:#16a34a;--danger:#dc2626;--warn:#f59e0b;--info:#0ea5e9;
  --s1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --s2:0 10px 30px rgba(16,24,40,.08),0 4px 10px rgba(16,24,40,.04);
  --s3:0 20px 50px rgba(16,24,40,.12);
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Playfair Display',Georgia,serif;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--text);line-height:1.6;
  background:
    radial-gradient(900px 700px at 12% -10%, rgba(15,23,42,.04), transparent 60%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select{font-family:inherit}

/* LAYOUT */
.admin-shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,#0f172a,#0b1220);color:#fff;
  position:fixed;top:0;left:0;bottom:0;z-index:60;
  display:flex;flex-direction:column;
  transition:transform .3s var(--ease);
  box-shadow:2px 0 20px rgba(15,23,42,.1);
}
.sidebar-head{
  padding:22px 20px 18px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.sidebar-logo{
  width:42px;height:42px;border-radius:12px;object-fit:cover;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 20px rgba(0,0,0,.3),0 0 0 3px rgba(255,255,255,.04);
}
.sidebar-brand strong{
  display:block;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-brand small{
  display:block;font-size:.54rem;letter-spacing:2.4px;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:3px;font-weight:600;
}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-group-label{
  font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.35);padding:12px 12px 8px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  font-size:.86rem;font-weight:500;color:rgba(255,255,255,.65);
  transition:all .22s var(--ease);margin-bottom:2px;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{
  color:#fff;background:rgba(255,255,255,.1);font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.nav-item.active svg{opacity:1}
.sidebar-foot{
  padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.06);
  font-size:.68rem;color:rgba(255,255,255,.4);text-align:center;line-height:1.6;
}
.sidebar-foot strong{color:rgba(255,255,255,.7);letter-spacing:1.2px;font-weight:700;display:block;margin-top:3px;}

.main{
  flex:1;margin-left:var(--sidebar-w);min-width:0;
  display:flex;flex-direction:column;
}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:40;padding:14px 26px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
}
.hamburger{
  display:none;width:38px;height:38px;border-radius:10px;
  background:transparent;border:none;cursor:pointer;color:var(--text);
  align-items:center;justify-content:center;
}
.hamburger:hover{background:rgba(15,23,42,.06)}
.hamburger svg{width:20px;height:20px}
.topbar-title{flex:1;min-width:0}
.topbar-title h1{
  font-family:var(--serif);font-size:1.15rem;font-weight:700;
  letter-spacing:-.3px;color:#0b1220;
}
.topbar-title p{font-size:.76rem;color:var(--muted);margin-top:1px;}
.admin-avatar{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(15,23,42,.08),0 6px 16px rgba(15,23,42,.15);
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);
  display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:.85rem;
}
.admin-avatar img{width:100%;height:100%;object-fit:cover}

/* CONTENT */
.content{padding:26px;flex:1}

/* TOOLBAR */
.toolbar{
  display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center;
  padding:14px 16px;border-radius:14px;
  background:linear-gradient(180deg,#fff,#fbfcfe);
  border:1px solid var(--border);box-shadow:var(--s2);
}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted-2);pointer-events:none;
}
.search-input{
  width:100%;padding:10px 12px 10px 36px;
  border-radius:10px;border:1px solid var(--border);
  background:#fff;font-size:.88rem;color:var(--text);
  box-shadow:var(--s1);transition:border .2s, box-shadow .25s;
}
.search-input:focus{
  outline:none;border-color:#0b1220;
  box-shadow:0 0 0 3px rgba(15,23,42,.05);
}
.filter-select{
  padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:#fff;font-size:.86rem;color:var(--text);cursor:pointer;
  box-shadow:var(--s1);
}
.filter-select:focus{outline:none;border-color:#0b1220}

/* RESULT COUNT */
.result-count{
  font-size:.82rem;color:var(--muted);margin-bottom:14px;
  display:flex;align-items:center;gap:6px;
}
.result-count strong{color:#0b1220;font-weight:600;}

/* POSTS LIST */
.posts-list{display:grid;grid-template-columns:1fr;gap:14px}

.post-card{
  padding:18px 20px;border-radius:16px;
  background:linear-gradient(180deg,#fff,#fbfcfe);
  border:1px solid var(--border);box-shadow:var(--s2);
  transition:box-shadow .25s var(--ease);
  animation:cardIn .4s var(--ease) backwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.post-card:hover{box-shadow:var(--s3), 0 0 0 1px rgba(15,23,42,.04)}

.post-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.post-avatar{
  width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(180deg,#f1f5f9,#e2e8f0);border:2px solid #fff;
  box-shadow:0 4px 12px rgba(15,23,42,.10);
  display:grid;place-items:center;font-weight:700;color:var(--muted);
}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-meta{flex:1;min-width:0}
.post-meta h4{
  font-size:.9rem;font-weight:600;color:#0b1220;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.post-meta .time{
  font-size:.74rem;color:var(--muted-2);margin-top:1px;
  display:flex;align-items:center;gap:4px;
}
.post-meta .time svg{width:11px;height:11px}
.reported-flag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:999px;
  background:rgba(220,38,38,.1);color:#b91c1c;
  font-size:.66rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  flex-shrink:0;
}
.reported-flag svg{width:11px;height:11px}

.post-content{
  font-size:.9rem;color:#334155;line-height:1.65;
  white-space:pre-wrap;word-wrap:break-word;margin-bottom:12px;
  max-height:200px;overflow:hidden;position:relative;
}
.post-content.expanded{max-height:none}
.post-media{
  border-radius:12px;overflow:hidden;margin-bottom:12px;
  border:1px solid var(--border);max-width:340px;
}
.post-media img{width:100%;max-height:220px;object-fit:cover;display:block}

.post-stats{
  display:flex;gap:16px;font-size:.76rem;color:var(--muted);
  padding-top:10px;border-top:1px dashed var(--border);margin-bottom:12px;
}
.post-stats .stat-item{display:inline-flex;align-items:center;gap:4px}
.post-stats .stat-item svg{width:13px;height:13px}

.post-actions{display:flex;gap:6px;flex-wrap:wrap}
.action-btn{
  padding:8px 12px;border-radius:9px;
  background:#fff;border:1px solid var(--border);
  font-size:.78rem;font-weight:600;color:#0b1220;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
  transition:all .2s var(--ease);white-space:nowrap;
}
.action-btn:hover{transform:translateY(-1px);box-shadow:var(--s1)}
.action-btn svg{width:13px;height:13px}
.action-btn.danger{color:#dc2626;border-color:rgba(220,38,38,.25)}
.action-btn.danger:hover{background:#fef2f2}
.action-btn.expand{margin-left:auto}

/* Empty / skeleton */
.empty{
  text-align:center;padding:50px 20px;color:var(--muted);
  font-size:.88rem;line-height:1.6;
  background:linear-gradient(180deg,#fff,#fbfcfe);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--s2);
}
.empty svg{width:42px;height:42px;color:var(--muted-2);margin:0 auto 12px;opacity:.6;}
.empty h3{font-family:var(--serif);font-size:1.1rem;color:#0b1220;margin-bottom:6px;}

.skeleton{
  background:linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{
  height:160px;border-radius:16px;
  background:#fff;border:1px solid var(--border);box-shadow:var(--s2);
  padding:18px;
}

/* Pagination */
.pagination{
  display:flex;justify-content:center;align-items:center;gap:8px;
  margin-top:22px;
}
.page-btn{
  padding:8px 14px;border-radius:9px;
  background:#fff;border:1px solid var(--border);
  font-size:.82rem;font-weight:600;color:var(--text);cursor:pointer;
  transition:all .2s var(--ease);
}
.page-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--s1)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:.82rem;color:var(--muted);padding:0 8px;}

/* Modals */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,23,42,.45);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .25s var(--ease);
}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:460px;
  background:#fff;border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  padding:26px 24px;
  animation:modalIn .35s var(--ease);
  position:relative;max-height:90vh;overflow-y:auto;
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{
  font-family:var(--serif);font-size:1.2rem;font-weight:700;
  letter-spacing:-.3px;margin-bottom:6px;
}
.modal p.sub{font-size:.84rem;color:var(--muted);margin-bottom:18px;}
.modal-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:10px;
  background:rgba(15,23,42,.05);border:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;
  transition:all .2s;
}
.modal-close:hover{background:rgba(15,23,42,.1);color:#0b1220}

.modal-actions{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
}
.btn-modal{
  padding:10px 18px;border-radius:11px;font-weight:600;font-size:.84rem;
  cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);
  transition:all .25s;
}
.btn-modal:hover{transform:translateY(-1px);box-shadow:var(--s2)}
.btn-modal.primary{
  background:linear-gradient(180deg,#0f172a,#0b1220);color:#fff;border-color:transparent;
  box-shadow:0 10px 24px rgba(15,23,42,.28);
}
.btn-modal.danger{background:linear-gradient(180deg,#991b1b,#7f1d1d);color:#fff;border-color:transparent;}
.btn-modal:disabled{opacity:.6;cursor:not-allowed;transform:none}

.spinner{width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;z-index:150;
  background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;padding:20px;
  cursor:zoom-out;animation:fadeIn .2s var(--ease);
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.lightbox-close{
  position:absolute;top:20px;right:20px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;border:none;cursor:pointer;
  display:grid;place-items:center;
}
.lightbox-close:hover{background:rgba(255,255,255,.2)}

/* Toast */
.toast-wrap{
  position:fixed;top:20px;right:20px;z-index:200;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  min-width:250px;max-width:340px;padding:12px 16px;border-radius:12px;
  background:#0b1220;color:#fff;font-size:.84rem;
  box-shadow:0 14px 30px rgba(15,23,42,.35);
  display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:toastIn .3s var(--ease);
}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Overlay */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;
  display:none;backdrop-filter:blur(3px);
}
.overlay.show{display:block;animation:fadeIn .2s}

@media (max-width:760px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .topbar{padding:12px 16px}
  .topbar-title h1{font-size:1rem}
  .content{padding:16px}
  .toolbar{padding:12px}
  .post-card{padding:14px 16px}
  .post-media{max-width:100%}
}
</style>
</head>

      </div>

      <!-- PAGINATION -->
      <div class="pagination" id="pagination" style="display:none">
        <button class="page-btn" id="prevBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M15 18l-6-6 6-6"/></svg>
          Prev
        </button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button class="page-btn" id="nextBtn">
          Next
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-left:4px"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </main>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 style="color:#991b1b">Delete post?</h3>
    <p class="sub">This action cannot be undone. The post will be permanently removed.</p>
    <div class="modal-actions">
      <button type="button" class="btn-modal" id="deleteCancelBtn">Cancel</button>
      <button type="button" class="btn-modal danger" id="deleteConfirmBtn">
        <span id="deleteBtnText">Delete Post</span>
      </button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="" />
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
  import { requireAdminAuth } from '../js/auth.js';
  import {
    getAllPostsAdmin, deletePost, getAllReportsAdmin
  } from '../js/app.js';
  import { showToast, initAdminUI } from '../js/admin.js';

  initAdminUI();

  let currentAdmin = null;
  let allPosts = [];
  let reportedPostIds = new Set();
  let filteredPosts = [];
  let currentSearch = '';
  let currentFilter = 'all';
  let currentPage = 1;
  const PAGE_SIZE = 10;
  let pendingDeleteId = null;

  // ============ ADMIN GUARD ============
  requireAdminAuth(async (adminUser, adminDoc) => {
    currentAdmin = adminUser;
    renderAdminAvatar(adminDoc);
    await loadPosts();
    bindEvents();
  });

  // ============ HELPERS ============
  function esc(s){
    if (s == null) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function timeAgo(ts){
    if (!ts) return 'just now';
    const date = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = (Date.now() - date.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function renderAdminAvatar(doc){
    const name = (doc && doc.name) || 'Admin';
    const photo = (doc && doc.profileImageBase64) || '';
    const wrap = document.getElementById('adminAvatar');
    if (photo){
      wrap.innerHTML = `<img src="${photo}" alt="">`;
    } else {
      wrap.innerHTML = `<span>${esc(name.charAt(0).toUpperCase())}</span>`;
    }
  }

  // ============ LOAD POSTS ============
   async function loadPosts(){
    try {
      const [posts, reports] = await Promise.all([
        getAllPostsAdmin().catch(()=>[]),
        getAllReportsAdmin().catch(()=>[])
      ]);
      allPosts = posts || [];
      // Build set of reported post IDs
      reportedPostIds = new Set(
        (reports || [])
          .filter(r => r.targetType === 'post' || r.postId)
          .map(r => r.postId || r.targetId)
      );
      applyFilters();
    } catch (e){
      console.error(e);
      showToast('Could not load posts.', 'error');
      document.getElementById('postsList').innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <h3>Could not load posts</h3>
          <p>Please refresh the page.</p>
        </div>`;
    }
  }

  // ============ FILTERING ============
  function applyFilters(){
    const q = currentSearch.trim().toLowerCase();
    filteredPosts = allPosts.filter(p => {
      const hasImage = !!p.imageBase64;
      const isReported = reportedPostIds.has(p.id);

      if (currentFilter === 'reported' && !isReported) return false;
      if (currentFilter === 'withImage' && !hasImage) return false;
      if (currentFilter === 'textOnly' && hasImage) return false;

      if (!q) return true;
      const text = (p.text || '').toLowerCase();
      const author = (p.author && p.author.name || '').toLowerCase();
      return text.includes(q) || author.includes(q);
    });

    // Sort by createdAt desc
    filteredPosts.sort((a, b) => {
      const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)) : new Date(0);
      const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)) : new Date(0);
      return tb - ta;
    });

    currentPage = 1;
    renderPosts();
  }

  // ============ RENDER POSTS ============
  function renderPosts(){
    const list = document.getElementById('postsList');
    const countWrap = document.getElementById('resultCount');
    const pagination = document.getElementById('pagination');

    if (!filteredPosts || filteredPosts.length === 0){
      list.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <h3>No posts found</h3>
          <p>Try adjusting your search or filter.</p>
        </div>`;
      countWrap.style.display = 'none';
      pagination.style.display = 'none';
      return;
    }

    countWrap.style.display = 'flex';
    document.getElementById('countNum').textContent = filteredPosts.length;

    const totalPages = Math.ceil(filteredPosts.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageItems = filteredPosts.slice(start, end);

    list.innerHTML = pageItems.map((p, i) => renderPostCard(p, i)).join('');

    if (totalPages > 1){
      pagination.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    } else {
      pagination.style.display = 'none';
    }

    bindPostEvents();
  }

  function renderPostCard(p, idx){
    const author = p.author || {};
    const name = author.name || 'Member';
    const photo = author.profileImageBase64 || '';
    const initial = name.charAt(0).toUpperCase();
    const isReported = reportedPostIds.has(p.id);
    const hasImage = !!p.imageBase64;
    const text = p.text || '';
    const isLong = text.length > 220;

    return `
      <article class="post-card" data-post-id="${esc(p.id)}" style="animation-delay:${Math.min(idx * 0.04, 0.3)}s">
        <div class="post-head">
          <div class="post-avatar">${photo ? `<img src="${photo}" alt="">` : esc(initial)}</div>
          <div class="post-meta">
            <h4>${esc(name)}</h4>
            <div class="time">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${esc(timeAgo(p.createdAt))}
            </div>
          </div>
          ${isReported ? `
            <span class="reported-flag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Reported
            </span>` : ''}
        </div>
        ${text ? `<div class="post-content ${isLong ? '' : 'expanded'}" data-content>${esc(text)}</div>` : ''}
        ${hasImage ? `
          <div class="post-media">
            <img src="${p.imageBase64}" alt="" loading="lazy" data-lightbox="${esc(p.id)}">
          </div>` : ''}
        <div class="post-stats">
          <span class="stat-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${p.likesCount || 0} likes
          </span>
          <span class="stat-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            ${p.commentsCount || 0} comments
          </span>
        </div>
        <div class="post-actions">
          ${isLong ? `<button class="action-btn expand" data-expand="${esc(p.id)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            Show more
          </button>` : ''}
          <a class="action-btn" href="../profile.html?uid=${esc(p.userId)}" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Author
          </a>
          <button class="action-btn danger" data-delete="${esc(p.id)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
          </button>
        </div>
      </article>`;
  }

  function bindPostEvents(){
    // Delete
    document.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => openDeleteModal(btn.getAttribute('data-delete')));
    });

    // Expand
    document.querySelectorAll('[data-expand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = btn.closest('.post-card');
        const content = card.querySelector('[data-content]');
        if (!content) return;
        const expanded = content.classList.toggle('expanded');
        btn.innerHTML = expanded
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg> Show less`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg> Show more`;
      });
    });

    // Lightbox
    document.querySelectorAll('[data-lightbox]').forEach(img => {
      img.addEventListener('click', () => {
        const id = img.getAttribute('data-lightbox');
        const post = allPosts.find(p => p.id === id);
        if (post && post.imageBase64) openLightbox(post.imageBase64);
      });
    });
  }

  // ============ DELETE MODAL ============
  const deleteModal = document.getElementById('deleteModal');
  function openDeleteModal(id){
    pendingDeleteId = id;
    deleteModal.classList.add('open');
  }
  document.getElementById('deleteCancelBtn').addEventListener('click', () => {
    pendingDeleteId = null;
    deleteModal.classList.remove('open');
  });
  deleteModal.addEventListener('click', (e) => {
    if (e.target === deleteModal){
      pendingDeleteId = null;
      deleteModal.classList.remove('open');
    }
  });
  document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const btn = document.getElementById('deleteConfirmBtn');
    const txt = document.getElementById('deleteBtnText');
    btn.disabled = true;
    txt.innerHTML = '<span class="spinner"></span> Deleting…';
    try {
      await deletePost(pendingDeleteId);
      showToast('Post deleted.', 'success');
      allPosts = allPosts.filter(p => p.id !== pendingDeleteId);
      pendingDeleteId = null;
      deleteModal.classList.remove('open');
      applyFilters();
    } catch (err){
      console.error(err);
      showToast('Could not delete post.', 'error');
    } finally {
      btn.disabled = false;
      txt.textContent = 'Delete Post';
    }
  });

  // ============ LIGHTBOX ============
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  function openLightbox(src){
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }
  document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) lightbox.classList.remove('open');
  });

  // ============ BIND EVENTS ============
  function bindEvents(){
    // Search
    let searchTimer = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 220);
    });

    // Filter
    document.getElementById('filterSelect').addEventListener('change', (e) => {
      currentFilter = e.target.value;
      applyFilters();
    });

    // Pagination
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentPage > 1){ currentPage--; renderPosts(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      const totalPages = Math.ceil(filteredPosts.length / PAGE_SIZE);
      if (currentPage < totalPages){ currentPage++; renderPosts(); }
    });

    // ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape'){
        deleteModal.classList.remove('open');
        lightbox.classList.remove('open');
      }
    });
  }
</script>
</body>
</html>
